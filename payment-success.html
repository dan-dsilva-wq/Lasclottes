<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Submitted | Lasclottes</title>
    <meta name="description" content="Return page after Lasclottes secure card checkout.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="Media/Logo/Lasclottes Logo 3 png.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=optional">
    <link rel="stylesheet" href="css/style.css?v=20260824b">
</head>
<body class="legal-page">
    <main class="status-shell">
        <section class="status-card" aria-labelledby="status-title">
            <img src="Media/optimized/lasclottes-logo-w320.webp" alt="Lasclottes" width="220" height="83">
            <p class="status-card__icon" id="status-icon" aria-hidden="true">…</p>
            <h1 id="status-title">Checking your payment</h1>
            <p id="status-message">Please wait while we securely verify the result with our booking system.</p>
            <p id="status-help"><strong>Do not close this page yet.</strong></p>
            <div class="status-card__actions">
                <a class="btn btn-primary" href="index.html">Return to the website</a>
                <a class="btn btn-outline" href="booking-terms.html">Booking terms</a>
            </div>
        </section>
    </main>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id') || '';
            const lang = (params.get('lang') || 'en').slice(0, 2);
            const copies = {
                en: {
                    confirmedTitle: 'Booking confirmed',
                    confirmed: (reference) => `Thank you. Your payment was received and your Lasclottes booking is confirmed${reference ? ` under reference ${reference}` : ''}.`,
                    confirmedHelp: 'A written confirmation will be emailed to you. If it does not arrive, contact info@lasclottes.com.',
                    processingTitle: 'Payment is being confirmed',
                    processing: 'Stripe has returned you to Lasclottes and the secure confirmation is still processing.',
                    processingHelp: 'Please wait here for a moment. Do not submit another payment.',
                    problemTitle: 'We could not confirm the booking',
                    problem: 'The payment result could not be verified from this page.',
                    problemHelp: 'Do not pay again. Contact info@lasclottes.com and include the time of your payment.'
                },
                fr: {
                    confirmedTitle: 'Réservation confirmée',
                    confirmed: (reference) => `Merci. Votre paiement a été reçu et votre réservation à Lasclottes est confirmée${reference ? ` sous la référence ${reference}` : ''}.`,
                    confirmedHelp: 'Une confirmation écrite vous sera envoyée par e-mail. Si elle n’arrive pas, contactez info@lasclottes.com.',
                    processingTitle: 'Confirmation du paiement en cours',
                    processing: 'Stripe vous a renvoyé vers Lasclottes et la confirmation sécurisée est toujours en cours.',
                    processingHelp: 'Veuillez patienter un instant. Ne soumettez pas un second paiement.',
                    problemTitle: 'Réservation non confirmée',
                    problem: 'Le résultat du paiement n’a pas pu être vérifié depuis cette page.',
                    problemHelp: 'Ne payez pas une seconde fois. Contactez info@lasclottes.com en indiquant l’heure du paiement.'
                },
                nl: {
                    confirmedTitle: 'Boeking bevestigd',
                    confirmed: (reference) => `Bedankt. Uw betaling is ontvangen en uw Lasclottes-boeking is bevestigd${reference ? ` met referentie ${reference}` : ''}.`,
                    confirmedHelp: 'U ontvangt een schriftelijke bevestiging per e-mail. Neem contact op met info@lasclottes.com als deze niet aankomt.',
                    processingTitle: 'Betaling wordt bevestigd',
                    processing: 'Stripe heeft u teruggestuurd naar Lasclottes en de beveiligde bevestiging wordt nog verwerkt.',
                    processingHelp: 'Wacht hier even. Dien geen tweede betaling in.',
                    problemTitle: 'Boeking niet bevestigd',
                    problem: 'Het betalingsresultaat kon vanaf deze pagina niet worden geverifieerd.',
                    problemHelp: 'Betaal niet opnieuw. Neem contact op met info@lasclottes.com en vermeld het tijdstip van betaling.'
                }
            };
            const text = copies[lang] || copies.en;
            const title = document.getElementById('status-title');
            const message = document.getElementById('status-message');
            const help = document.getElementById('status-help');
            const icon = document.getElementById('status-icon');

            const render = (state, reference = '') => {
                if (state === 'confirmed') {
                    title.textContent = text.confirmedTitle;
                    message.textContent = text.confirmed(reference);
                    help.textContent = text.confirmedHelp;
                    icon.textContent = '✓';
                } else if (state === 'processing') {
                    title.textContent = text.processingTitle;
                    message.textContent = text.processing;
                    help.textContent = text.processingHelp;
                    icon.textContent = '…';
                } else {
                    title.textContent = text.problemTitle;
                    message.textContent = text.problem;
                    help.textContent = text.problemHelp;
                    icon.textContent = '!';
                }
            };

            const verify = async () => {
                if (!/^cs_(?:test|live)_[A-Za-z0-9]+$/.test(sessionId)) {
                    render('problem');
                    return;
                }
                for (let attempt = 0; attempt < 5; attempt += 1) {
                    try {
                        const response = await fetch(`/api/booking-status?session_id=${encodeURIComponent(sessionId)}`, { cache: 'no-store' });
                        const data = await response.json().catch(() => ({}));
                        if (response.ok && data.status === 'confirmed') {
                            render('confirmed', data.reference);
                            return;
                        }
                        if (response.ok && data.status === 'not_confirmed') {
                            render('problem');
                            return;
                        }
                    } catch (_) {}
                    render('processing');
                    await new Promise((resolve) => setTimeout(resolve, 1800));
                }
                render('processing');
            };
            verify();
        })();
    </script>
</body>
</html>
