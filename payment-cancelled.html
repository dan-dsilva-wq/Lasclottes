<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Not Completed | Lasclottes</title>
    <meta name="description" content="Return to Lasclottes after leaving secure card checkout.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="Media/Logo/Lasclottes Logo 3 png.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=optional">
    <link rel="stylesheet" href="css/style.css?v=20260824b">
</head>
<body class="legal-page">
    <main class="status-shell">
        <section class="status-card" aria-labelledby="status-title">
            <img src="Media/optimized/lasclottes-logo-w320.webp" alt="Lasclottes" width="220" height="83">
            <p class="status-card__icon status-card__icon--neutral" aria-hidden="true">↩</p>
            <h1 id="status-title">Payment not completed</h1>
            <p>You returned before completing Stripe checkout, so this attempt has not reserved the dates.</p>
            <p>You can return to the booking form to try again, or contact us directly if you would prefer help.</p>
            <div class="status-card__actions">
                <a class="btn btn-primary" href="index.html#contact">Return to booking</a>
                <a class="btn btn-outline" href="mailto:info@lasclottes.com">Email us</a>
            </div>
        </section>
    </main>
</body>
</html>
