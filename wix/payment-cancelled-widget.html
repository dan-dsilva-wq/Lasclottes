<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light;--ink:#213028;--muted:#5f6f65;--paper:#fff;--cream:#fbf7ee;--forest:#284d37;--line:#d9ded8;--gold:#bd8c43}
    *{box-sizing:border-box}
    body{margin:0;background:transparent;color:var(--ink);font:16px/1.55 Arial,sans-serif}
    main{max-width:700px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 45px rgba(32,48,40,.12);padding:clamp(26px,6vw,52px);text-align:center}
    .mark{width:66px;height:66px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#fff3d6;color:#76551f;font:700 34px/1 Georgia,serif}
    h1{margin:0 0 12px;color:var(--forest);font:700 clamp(32px,6vw,50px)/1.05 Georgia,serif}
    p{margin:10px auto;color:var(--muted);max-width:560px}
    strong{color:var(--ink)}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    a{display:inline-block;border-radius:999px;padding:13px 22px;font-weight:700;text-decoration:none}
    .primary{background:var(--forest);color:#fff}
    .secondary{border:1px solid var(--forest);color:var(--forest);background:var(--cream)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">×</div>
    <h1>Payment not completed</h1>
    <p><strong>No payment was taken and your dates have not been reserved.</strong></p>
    <p>You can return to the booking page and try again, or contact Sally if you would like help.</p>
    <div class="actions">
      <a class="primary" href="/replacement-preview" target="_top">Return to booking</a>
      <a class="secondary" href="mailto:info@lasclottes.com" target="_top">Contact Lasclottes</a>
    </div>
  </main>
</body>
</html>
